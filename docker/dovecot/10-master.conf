# Dovecot Master Process Configuration (Lightweight VPS optimized)

default_process_limit = 25
default_client_limit = 100

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 1
  service_count = 0
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
  process_min_avail = 0
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service imap {
  process_limit = 25
}

service pop3 {
  process_limit = 10
}

service auth {
  # Postfix smtp-auth listener
  inet_listener postfix {
    port = 12345
  }
}

service auth-worker {
  user = root
}
