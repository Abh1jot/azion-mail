name: Build & Push All Images → GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Next.js Web Dashboard & API
  # ---------------------------------------------------------------------------
  build-web:
    name: Build azion-mail-web
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified), 'src/') ||
      contains(toJson(github.event.commits.*.added),    'src/') ||
      contains(toJson(github.event.commits.*.removed),  'src/') ||
      contains(toJson(github.event.commits.*.modified), 'prisma/') ||
      contains(toJson(github.event.commits.*.added),    'prisma/') ||
      contains(toJson(github.event.commits.*.removed),  'prisma/') ||
      contains(toJson(github.event.commits.*.modified), 'public/') ||
      contains(toJson(github.event.commits.*.added),    'public/') ||
      contains(toJson(github.event.commits.*.modified), 'package') ||
      contains(toJson(github.event.commits.*.added),    'package') ||
      contains(toJson(github.event.commits.*.modified), 'next.config') ||
      contains(toJson(github.event.commits.*.modified), 'docker/web/') ||
      contains(toJson(github.event.commits.*.added),    'docker/web/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/abh1jot/azion-mail-web:latest
            ghcr.io/abh1jot/azion-mail-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          echo "## ✅ azion-mail-web pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/abh1jot/azion-mail-web:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # 2. Postfix SMTP Server
  # ---------------------------------------------------------------------------
  build-postfix:
    name: Build azion-mail-postfix
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified), 'docker/postfix/') ||
      contains(toJson(github.event.commits.*.added),    'docker/postfix/') ||
      contains(toJson(github.event.commits.*.removed),  'docker/postfix/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push postfix image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker/postfix
          file: ./docker/postfix/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/abh1jot/azion-mail-postfix:latest
            ghcr.io/abh1jot/azion-mail-postfix:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=postfix
          cache-to: type=gha,mode=max,scope=postfix

      - name: Summary
        run: |
          echo "## ✅ azion-mail-postfix pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/abh1jot/azion-mail-postfix:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # 3. Dovecot IMAP / POP3 / LMTP
  # ---------------------------------------------------------------------------
  build-dovecot:
    name: Build azion-mail-dovecot
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified), 'docker/dovecot/') ||
      contains(toJson(github.event.commits.*.added),    'docker/dovecot/') ||
      contains(toJson(github.event.commits.*.removed),  'docker/dovecot/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push dovecot image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker/dovecot
          file: ./docker/dovecot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/abh1jot/azion-mail-dovecot:latest
            ghcr.io/abh1jot/azion-mail-dovecot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dovecot
          cache-to: type=gha,mode=max,scope=dovecot

      - name: Summary
        run: |
          echo "## ✅ azion-mail-dovecot pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/abh1jot/azion-mail-dovecot:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # 4. Rspamd Spam Filter & DKIM Signer
  # ---------------------------------------------------------------------------
  build-rspamd:
    name: Build azion-mail-rspamd
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified), 'docker/rspamd/') ||
      contains(toJson(github.event.commits.*.added),    'docker/rspamd/') ||
      contains(toJson(github.event.commits.*.removed),  'docker/rspamd/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push rspamd image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker/rspamd
          file: ./docker/rspamd/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/abh1jot/azion-mail-rspamd:latest
            ghcr.io/abh1jot/azion-mail-rspamd:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=rspamd
          cache-to: type=gha,mode=max,scope=rspamd

      - name: Summary
        run: |
          echo "## ✅ azion-mail-rspamd pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/abh1jot/azion-mail-rspamd:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
